# Scans the repository (package-lock.json, secrets) for known vulnerabilities with Trivy
# and reports the findings to GitHub Security (Code scanning alerts).
name: Trivy Scan

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif

      # Fork PRs get a read-only token, so uploading to code scanning would fail.
      - name: Upload scan results to GitHub Security
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs